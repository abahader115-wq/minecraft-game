<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minecraft Mobile</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial;touch-action:none}
#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;color:white;font-size:24px;text-align:center;pointer-events:none;z-index:5}
#hotbar{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.slot{width:50px;height:50px;border:3px solid #333;background:#8B8B8B;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;font-size:11px;text-align:center;color:white;text-shadow:1px 1px 2px black}
.slot.active{border-color:yellow;transform:scale(1.15)}
#joystick{position:absolute;bottom:20px;left:20px;width:100px;height:100px;background:rgba(0,0,0,0.3);border-radius:50%;z-index:10}
#knob{position:absolute;width:40px;height:40px;background:rgba(255,255,255,0.6);border-radius:50%;left:30px;top:30px}
#buttons{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:10}
.btn{width:65px;height:65px;background:rgba(0,0,0,0.5);border:2px solid white;color:white;border-radius:12px;font-weight:bold}
#lookArea{position:absolute;top:0;right:0;width:50%;height:70%;z-index:1}
#msg{position:absolute;top:10px;left:10px;color:white;background:rgba(0,0,0,0.5);padding:5px;border-radius:5px;font-size:12px;z-index:10}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="crosshair">+</div>
<div id="msg">Mobile: Left joystick=Chalna<br>Right side drag=Dekhna<br>Buttons se Torna/Lagana</div>
<div id="hotbar"></div>
<div id="joystick"><div id="knob"></div></div>
<div id="buttons">
<button class="btn" id="jumpBtn">JUMP</button>
<button class="btn" id="breakBtn">TORO</button>
<button class="btn" id="placeBtn">LAGAO</button>
</div>
<div id="lookArea"></div>
<script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB); scene.fog=new THREE.Fog(0x87CEEB,20,100);
let camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,2,5);
let renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(window.innerWidth,window.innerHeight); document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.9)); let dl=new THREE.DirectionalLight(0xffffff,1); dl.position.set(10,20,10); scene.add(dl);
const BLOCKS=[{name:'Grass',color:0x3cb043},{name:'Dirt',color:0x8B4513},{name:'Stone',color:0x7f7f7f},{name:'Wood',color:0x5C4033},{name:'Planks',color:0xC19A6B}];
let selected=0; let hotbarDiv=document.getElementById('hotbar');
function updateHotbar(){hotbarDiv.innerHTML='';BLOCKS.forEach((b,i)=>{let d=document.createElement('div');d.className='slot'+(i==selected?' active':'');d.style.backgroundColor='#'+b.color.toString(16).padStart(6,'0');d.innerHTML=b.name;d.onclick=()=>{selected=i;updateHotbar();};hotbarDiv.appendChild(d);});}updateHotbar();
let blocks=new Map(); let geom=new THREE.BoxGeometry(1,1,1);
function addBlock(x,y,z,t){let k=`${x},${y},${z}`;if(blocks.has(k))return;let m=new THREE.Mesh(geom,new THREE.MeshLambertMaterial({color:BLOCKS[t].color}));m.position.set(x,y,z);m.userData.key=k;scene.add(m);blocks.set(k,m);}
function removeBlock(o){scene.remove(o);blocks.delete(o.userData.key);}
for(let x=-15;x<15;x++){for(let z=-15;z<15;z++){addBlock(x,-1,z,0);addBlock(x,-2,z,1);addBlock(x,-3,z,2);if(Math.random()<0.03){let h=Math.floor(Math.random()*4)+1;for(let y=0;y<h;y++)addBlock(x,y,z,3);}}}
let raycaster=new THREE.Raycaster(); let center=new THREE.Vector2(0,0);
function getTarget(){raycaster.setFromCamera(center,camera);let inter=raycaster.intersectObjects(Array.from(blocks.values()));return inter.length>0?inter[0]:null;}
// Touch Controls
let moveX=0,moveY=0;
let joystick=document.getElementById('joystick');let knob=document.getElementById('knob');
joystick.addEventListener('touchstart',e=>e.preventDefault());
joystick.addEventListener('touchmove',e=>{
 e.preventDefault();
 let rect=joystick.getBoundingClientRect();
 let t=e.touches[0];
 let x=t.clientX-rect.left-50; let y=t.clientY-rect.top-50;
 let dist=Math.sqrt(x*x+y*y); if(dist>40){x=x/dist*40;y=y/dist*40;}
 knob.style.left=30+x+'px'; knob.style.top=30+y+'px';
 moveX=x/40; moveY=-y/40;
},{passive:false});
joystick.addEventListener('touchend',()=>{knob.style.left='30px';knob.style.top='30px';moveX=0;moveY=0;});
// Look controls
let yaw=0,pitch=0;
let lookArea=document.getElementById('lookArea');
let lastTouch=null;
lookArea.addEventListener('touchmove',e=>{
 e.preventDefault();
 let t=e.touches[0];
 if(lastTouch){yaw-=(t.clientX-lastTouch.x)*0.005; pitch+=(t.clientY-lastTouch.y)*0.005; pitch=Math.max(-1.5,Math.min(1.5,pitch));}
 lastTouch={x:t.clientX,y:t.clientY};
},{passive:false});
lookArea.addEventListener('touchend',()=>{lastTouch=null;});
document.getElementById('breakBtn').addEventListener('touchstart',e=>{e.preventDefault();let t=getTarget();if(t&&t.object.position.y>-2)removeBlock(t.object);});
document.getElementById('placeBtn').addEventListener('touchstart',e=>{e.preventDefault();let t=getTarget();if(t){let p=t.object.position.clone().add(t.face.normal);addBlock(Math.round(p.x),Math.round(p.y),Math.round(p.z),selected);}});
let velY=0;let onGround=false;
document.getElementById('jumpBtn').addEventListener('touchstart',e=>{e.preventDefault();if(onGround)velY=0.22;});
function animate(){
 requestAnimationFrame(animate);
 // move
 let forward=new THREE.Vector3(); camera.getWorldDirection(forward); forward.y=0; forward.normalize();
 let right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).negate();
 camera.position.addScaledVector(forward,moveY*0.15);
 camera.position.addScaledVector(right,moveX*0.15);
 // gravity
 velY-=0.012; camera.position.y+=velY;
 if(camera.position.y<1.6){camera.position.y=1.6;velY=0;onGround=true;}else onGround=false;
 camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
 renderer.render(scene,camera);
}animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
</body>
</html>
